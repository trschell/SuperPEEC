# IHP SG13G2 octagonal spiral inductor inside a CLOSED Metal5 guard ring -- SuperPEEC model
# generated by studies/ihp_spiral_gds2toml.py from ring_closed.gds (coil as a trace)
# (layout: studies/ihp_spiral_gds.py --ring on the IHP gdsfactory PDK, ihp-gdsfactory)
#
# 10 turns, width 15.0 um, space 3.0 um, inner diameter 240 um, outer 630 um flat to flat
# square Metal5 guard ring 6 um wide, 15 um outside the coil; CLOSED -- a shorted turn around the coil (the conductor has a hole: b1 = 1)
# stack (PDK, um): metal5 4.89+0.49, topmetal1 6.23+2.00, topvia2 8.23+2.80, topmetal2 11.03+3.00
# modelled (um, rounded to the 0.25 um grid): Metal5 [0,0.5), TopMetal1 [1.5,3.5), TopVia2 [3.5,6.5), TopMetal2 [6.5,9.5)
# sigma (nominal, S/m): TM2 3e+07, TM1 2.8e+07, M5 2.5e+07, W 1.8e+07 x via-array fill; no substrate/oxide
#
# ATTRIBUTION: layer numbers and the SG13G2 BEOL stack come from the
# IHP Open PDK through ihp-gdsfactory (Apache-2.0,
# https://github.com/gdsfactory/IHP); the layout is generated by
# studies/ihp_spiral_gds.py. No PDK file is copied here.
#
# WHAT THIS MODEL IS (and is not): the conductors in free space --
# the coil's inductance and its conductor loss with skin and
# proximity effect, and the current the field induces in the ring.
# A real SG13G2 coil sits on ~6 um of oxide over a lossy silicon
# substrate, which sets its self-resonance and most of its Q loss
# above a few GHz; neither is represented here (no capacitance, no
# substrate). Use L and the conductor R.
#
# pitch 0.25 um cubic: lattice 2704 x 2860 x 38 = 293.9 M, staircase estimate ~43.20 M occupied cells, 8 blocks, 1 traces
#
# MEASURED (2026-10-07, sppeec, OpenCL fp32, 62 GB host, 12 GB card):
#   occupied cells 43,538,700 (959,028 partial); 121.3 M loops, 1 hole
#   generator (b1 = 1). 1:00:53 wall, peak RSS 55.7 GB -- run it under a
#   memory cap (systemd-run --user --scope -p MemoryMax=56G) on a 64 GB
#   machine.
#     f        R [ohm]   L [nH]   mv   vs NO ring (same lattice): R, L
#     1 GHz    28.566    49.495   42    +69.6 %, -1.99 %  (no ring 16.844 ohm, 50.499 nH)
#     5 GHz    84.221    45.339   50   +131.9 %, -8.07 %  (no ring 36.320 ohm, 49.320 nH)
#     10 GHz   106.176   44.597   52   +100.0 %, -8.99 %  (no ring 53.090 ohm, 49.000 nH)
#   The closed ring is a SHORTED TURN: the coil's field drives a
#   circulating current in it, which cancels part of the coil's flux
#   (L down) and dissipates (R up) -- the conductor-only Q at 5 GHz
#   falls from ~43 to ~17. Compare ihp_spiral_ring_slotted_*: a 4 um
#   slot removes it. The conductor has a hole (b1 = 1): this model
#   needs the hole-generator search, which at this size ran out of
#   memory before ded057b.

[grid]
dims  = [2704, 2860, 38]
pitch = [2.5e-07, 2.5e-07, 2.5e-07]

[port]
name  = "P1"
equipotential = true
