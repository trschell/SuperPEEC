# IHP SG13G2 octagonal spiral inductor -- SuperPEEC model
# generated by studies/ihp_spiral_gds2toml.py from spiral10.gds (coil as trace)
# (layout: studies/ihp_spiral_gds.py on the IHP gdsfactory PDK, ihp-gdsfactory)
#
# 10 turns, width 15.0 um, space 3.0 um, inner diameter 240 um, outer 630 um flat to flat; coil centreline 14.48 mm
# stack (PDK, um): TopMetal1 6.23+2.0, TopVia2 8.23+2.8, TopMetal2 11.03+3.0; modelled TM1 [0,2), TV2 [2,5) (2.8 -> 3.0), TM2 [5,8)
# sigma (nominal, S/m): TM2 3e+07, TM1 2.8e+07, W 1.8e+07 x array fill (0.189, 0.189); no substrate/oxide
#
# ATTRIBUTION: layer numbers and the SG13G2 BEOL stack come from the
# IHP Open PDK through ihp-gdsfactory (Apache-2.0,
# https://github.com/gdsfactory/IHP); the spiral itself is generated
# by studies/ihp_spiral_gds.py (the PDK's inductor2/3 PCells are
# 1-3 turn cells). No PDK file is copied here.
#
# WHAT THIS MODEL IS (and is not): the conductors in free space --
# the coil's inductance and its conductor loss with skin and
# proximity effect. A real SG13G2 coil sits on ~6 um of oxide over a
# lossy silicon substrate, which sets its self-resonance and most of
# its Q loss above a few GHz; neither is represented here (no
# capacitance, no substrate). Use L and the conductor R; take Q and
# SRF from a substrate-aware solver.
#
# pitch 0.5 um cubic: lattice 1233 x 1370 x 16 = 27.0 M, staircase estimate ~5.32 M occupied cells, 4 blocks, 1 traces
#
# MEASURED (2026-10-05, sppeec ec2f463, OpenCL fp32, 62 GB host, 12 GB card):
#   occupied cells 5,431,722 (234,024 partial rim cells); 14.1 M loops,
#   370 port cycles. Wall 7:27 for the three frequencies, peak RSS 9.6 GB.
#     f        R [ohm]   L [nH]   matvecs
#     1 GHz    16.843    50.499   33
#     5 GHz    36.220    49.320   42
#     10 GHz   52.700    49.002   49
#   The quick rung of examples/ihp_spiral_0p25um.toml (same geometry).

