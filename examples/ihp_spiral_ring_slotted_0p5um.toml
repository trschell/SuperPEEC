# IHP SG13G2 octagonal spiral inductor inside a SLOTTED Metal5 guard ring -- SuperPEEC model
# generated by studies/ihp_spiral_gds2toml.py from ring_slotted.gds (coil as a trace)
# (layout: studies/ihp_spiral_gds.py --ring on the IHP gdsfactory PDK, ihp-gdsfactory)
#
# 10 turns, width 15.0 um, space 3.0 um, inner diameter 240 um, outer 630 um flat to flat
# square Metal5 guard ring 6 um wide, 15 um outside the coil; slotted (4 um) in its top side, so it carries no circulating current
# stack (PDK, um): metal5 4.89+0.49, topmetal1 6.23+2.00, topvia2 8.23+2.80, topmetal2 11.03+3.00
# modelled (um, rounded to the 0.25 um grid): Metal5 [0,0.5), TopMetal1 [1.5,3.5), TopVia2 [3.5,6.5), TopMetal2 [6.5,9.5)
# sigma (nominal, S/m): TM2 3e+07, TM1 2.8e+07, M5 2.5e+07, W 1.8e+07 x via-array fill; no substrate/oxide
#
# ATTRIBUTION: layer numbers and the SG13G2 BEOL stack come from the
# IHP Open PDK through ihp-gdsfactory (Apache-2.0,
# https://github.com/gdsfactory/IHP); the layout is generated by
# studies/ihp_spiral_gds.py. No PDK file is copied here.
#
# WHAT THIS MODEL IS (and is not): the conductors in free space --
# the coil's inductance and its conductor loss with skin and
# proximity effect, and the current the field induces in the ring.
# A real SG13G2 coil sits on ~6 um of oxide over a lossy silicon
# substrate, which sets its self-resonance and most of its Q loss
# above a few GHz; neither is represented here (no capacitance, no
# substrate). Use L and the conductor R.
#
# pitch 0.5 um cubic: lattice 1352 x 1430 x 19 = 36.7 M, staircase estimate ~5.40 M occupied cells, 9 blocks, 1 traces
#
# MEASURED (2026-10-07, sppeec, OpenCL fp32, 62 GB host, 12 GB card):
#   occupied cells 5,495,562 (234,024 partial); 7:27 wall, peak RSS 8.2 GB.
#     f        R [ohm]   L [nH]   mv   vs NO ring (same lattice): R, L
#     1 GHz    16.845    50.500   34     +0.0 %, +0.00 %  (no ring 16.843 ohm, 50.500 nH)
#     5 GHz    36.281    49.321   42     +0.2 %, +0.00 %  (no ring 36.226 ohm, 49.321 nH)
#     10 GHz   52.886    49.001   49     +0.3 %, -0.00 %  (no ring 52.713 ohm, 49.003 nH)
#   The 4 um slot breaks the ring's loop (b1 = 0): no circulating
#   current, so the coil is almost exactly as without a ring.
#   Compare ihp_spiral_ring_closed_*, where the closed ring is a
#   shorted turn (R x2, L -9 % at 10 GHz).

