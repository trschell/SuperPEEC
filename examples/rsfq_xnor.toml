# SPDX-License-Identifier: MIT
# THE MOST INTRICATE CELL IN RSFQlib, and the RSFQ hero geometry.
#
# Chosen by measurement over the whole v3p0 library: 19 Josephson
# junctions, 58 inductors and 2146 drawn polygons in 4213 um^2 -- the
# maximum on every one of those counts (next: AND2T 17/54/1482,
# NDROT 16/56/1542). Four signal ports P1-P4 and eight bias ports
# PB1-PB8 carry InductEx labels on GDS layer 182.
#
# PITCH. 100 nm in plane; 67.5 nm in z because that is the pitch at
# which the SFQ5ee stack is faithful, not merely fine. M5 is 135 nm
# on a 90 nm London depth, so its thickness is load-bearing, and
# 135 = 2 x 67.5 exactly. Measured layer-thickness error against the
# published stack:
#
#   pz = 100 nm    worst 50 nm   M5 135->100, C5J 130->100, J5 150->200
#   pz =  67.5 nm  worst 15 nm   M5 EXACT, every metal within 1.25%
#   pz =  50 nm    worst 30 nm   M5 135->150, C5J 130->100
#   pz =  25 nm    worst 20 nm   M5 135->125, I5 280->300
#
# 67.5 nm wins despite not being the finest: the 200 nm layers land
# at 202.5 (+1.25%) while the layers that matter most land exactly.
#
# TOPOLOGY, and the known blocker. b1 = 854 independent tunnels
# through the conductor (Euler characteristic of the occupancy grid,
# EquiTerminalSolver._betti1) -- 2.9x the JTL's 292, and the JTL is
# what exposed the 50 nm stall: the greedy tree-cotree collapse
# declares MORE generators than the topology needs, the surplus
# columns are linearly dependent, they land in the macro Schur block,
# and its LU inverts v-cycle noise along those directions. b1 is
# pitch-invariant (854 at both 100 and 67.5 nm z, as an invariant
# must be) but the greedy SURPLUS grows with refinement. Expect this
# cell to press on that stall harder than the JTL did; it is the
# reason this file exists as a hero case rather than a routine one.
#
# Junctions are all SHORTED here (M5 and M6 galvanically joined at
# each junction footprint), which is how InductEx models them for
# inductance extraction and gives the maximally connected network.
# Re-run studies/rsfq_gds2toml.py with --short/--open to isolate
# individual loop inductances against the back-annotated netlist.

