# IHP SG13G2 1:1 STACKED octagonal transformer -- SuperPEEC model
# generated by studies/ihp_spiral_gds2toml.py from sxfmr6.gds (coils as traces)
# (layout: studies/ihp_stacked_transformer_gds.py on the IHP gdsfactory PDK, ihp-gdsfactory)
#
# 6 turns per winding, width 15.0 um, space 3.0 um, inner diameter 240 um, outer 486 um flat to flat; 7.36 mm per winding
# primary on TopMetal2 over the secondary on TopMetal1, turn over turn (broadside); inner ends
# out through Metal5 underpasses (TopVia1 / TopVia2 stacks). The two coils overlap in plan
# view at different heights: a multi-span section cut.
# DRIVEN: the secondary (port P1 on its TopMetal1 lead pair); the primary is open
# stack (PDK, um): metal5 4.89+0.49, topvia1 5.38+0.85, topmetal1 6.23+2.00, topvia2 8.23+2.80, topmetal2 11.03+3.00
# modelled (um, rounded to the 0.25 um grid): Metal5 [0,0.5), TopVia1 [0.5,1.5), TopMetal1 [1.5,3.5), TopVia2 [3.5,6.5), TopMetal2 [6.5,9.5)
# sigma (nominal, S/m): TM2 3e+07, TM1 2.8e+07, M5 2.5e+07, W 1.8e+07 x via-array fill; no substrate/oxide
#
# ATTRIBUTION: layer numbers and the SG13G2 BEOL stack come from the
# IHP Open PDK through ihp-gdsfactory (Apache-2.0,
# https://github.com/gdsfactory/IHP); the transformer itself is
# generated by studies/ihp_stacked_transformer_gds.py. No PDK file
# is copied here.
#
# WHAT THIS MODEL IS (and is not): the conductors in free space --
# inductances, coupling and conductor loss with skin and proximity
# effect. A real SG13G2 transformer sits on ~6 um of oxide over a
# lossy silicon substrate, and a STACKED one has a large interwinding
# capacitance (the windings are ~3 um apart, face to face); none of
# that is represented here (no capacitance, no substrate). Use L1,
# L2, M, k and the winding resistances; take Q, SRF and the
# common-mode coupling from a solver with capacitance. The 2-port
# is read with studies/ihp_transformer_2port.py from the _p1 and
# _p2 files.
#
# pitch 0.25 um cubic: lattice 1890 x 2164 x 38 = 155.4 M, staircase estimate ~36.06 M occupied cells, 12 blocks, 2 traces
#
# MEASURED (2026-10-05, sppeec, OpenCL fp32, 62 GB host, 12 GB card), 2-port
# by studies/ihp_transformer_2port.py from the _p1 and _p2 files:
#   occupied cells 36,177,772 (810,600 partial rim cells), two section
#   layers (the TopMetal1 and TopMetal2 spans). Each drive ~1:25 wall,
#   peak RSS 50.7 GB -- one drive per process (--only 1 / --only 2, then
#   --combine), under a memory cap (systemd-run --user --scope -p
#   MemoryMax=56G) on a 64 GB machine.
#     f        R1 [ohm]  R2 [ohm]  L1 [nH]  L2 [nH]  M [nH]   k       R12 [ohm]
#     1 GHz    9.275     12.391    17.700   17.445   16.342   0.9300  2.788
#     5 GHz    19.389    23.411    17.128   16.834   15.839   0.9328  10.014
#     10 GHz   29.394    32.150    16.949   16.640   15.722   0.9362  15.111
#   0.5 -> 0.25 um: k +0.0001 / +0.0002 / +0.0003. Reciprocity ~8e-4 on
#   both rungs (a port-definition effect, see _0p5um); M is the mean of
#   Z12 and Z21. The coplanar interwound transformer of the same lane
#   pitch (examples/ihp_transformer_*) reaches k 0.876: broadside
#   coupling is why stacked transformers exist.

