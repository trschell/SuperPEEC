# SPDX-License-Identifier: MIT
# IHP SG13G2 MOM finger capacitor, 1 row x 16 inside fingers, 14.21 um fingers
# (Metal2-Metal5, 15.925 x 15.925 um), at 0.1225 um pitch -- the LpPR capacitor ladder.
#
# GEOMETRY: the topology of the IHP gdsfactory PDK's cmom cell -- on every
# metal from Metal2 to Metal5, two interdigitated combs (17 fingers hanging from the
# PLUS bus, 16 standing on the MINUS bus), fingers 0.245 um wide at 0.245 um space,
# buses 0.735 um tall, the buses of all layers tied by a row of 0.19 um vias
# (0.22 um space) along each bus centre. Drawn at legal per-layer widths: the
# PDK cell itself draws the global minimum width (0.14 um) on every layer,
# below the Metal3-5 rule (Mn.a 0.20 / Mn.b 0.21 / Mn.e 0.24 to a wide bus).
#
# ATTRIBUTION: layer numbers, design rules and the SG13G2 BEOL stack come from
# the IHP Open PDK through ihp-gdsfactory (Apache-2.0,
# https://github.com/gdsfactory/IHP). No PDK file is copied here.
#
# Model: a floating capacitor in a uniform oxide (eps_r 3.9, the PDK's own
# intermetal value; C scales with it exactly). No substrate and no ground: the
# real cell couples ~a few % of C to the silicon below and loses Q there -- the
# shielded 2-port is the next rung of realism. Metal sigma 2.5e+07 S/m and via
# 1.8e+07 S/m are nominal (as the IHP spiral examples). Via layers are modelled
# 0.49 um thick (real 0.54) at every pitch so the refinement rungs share one
# geometry; each via row is a finger-width bar carrying the row's real
# vertical resistance. Quasi-static (no retardation): valid while the
# structure is under ~lambda/20 in the oxide -- here up to 477 GHz.
#
# Terminals: PLUS and MINUS on the Metal5 pins (bus centres, as the PDK cell).
# Lateral parallel-plate estimate, no fringe: 123.5 fF.
# 147456 metal cells + 6240 via-bar cells = 153696 occupied.
#
# MEASURED (2026-10-09, sppeec de8ee96, defaults: diagschur + GCROT(120, 40),
#   CPU, 62 GB host): 153696 occupied cells; wall 6:43 for the seven frequencies,
#   peak RSS 3.6 GiB; Schur solve: splu (amg requested, SA rho 0.58 >= 0.5).
#     f [GHz]   ESR [ohm]   Im Z [ohm]   C_eff [fF]      Q   matvecs
#           1      0.2707    -841.4850       189.14     3108     72
#          10      0.2711     -83.8544       189.80      309     57
#          30      0.2738     -27.1598       195.33       99     65
#          60      0.2813     -12.2453       216.62       44     76
#         100      0.2960      -5.4500       292.03       18     89
#         200      0.3520       1.7317    inductive        5    123
#         300      0.4304       6.1560    inductive       14    156
#   series-RLC fit over the sweep: C 188.93 fF, ESL 4.73 pH, SRF 168 GHz
#   (Im Z reproduced within 6.7e-03); inductive above the SRF.

