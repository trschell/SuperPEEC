# SPDX-License-Identifier: MIT
# The three-wire power-module capstone: two copper pads bridged by
# three heavy aluminium bond wires, driven from the pads' far edges.
# Loop R(f), L(f) and per-wire current sharing, all couplings solved
# together (wire<->wire proximity, wire<->pad image screening, pad
# skin/eddy, foot constriction).
#
# Conventions: docs/input_doctrine.md. SI units; world origin at the
# corner of voxel (0,0,0); blocks are half-open cell ranges.
#
# Geometry: 100 um pitch. Pads 3.0 x 2.1 x 0.3 mm with a 0.5 mm gap.
# Wires: 125 um radius (250 um heavy Al bond), feet 0.5 mm inside
# each pad (contacts at x = 2.45/4.05 mm = cell CENTRES 24.5/40.5
# -- a boundary contact gets its foot tie-broken), VERTICAL landings (a fat wire must land steeply so its
# cross-section stays clear of the metal it grazes -- the overlap
# rule), arc apex 1.4 mm. Pad width is an ODD 21 cells so the wire
# trio (y = 0.45/1.05/1.65 mm = cells 4.5/10.5/16.5) sits on CELL
# CENTRES, mirrored about the true centreline -- a contact on a cell
# boundary gets its foot tie-broken half a cell off (measured as a
# 9e-4 sharing asymmetry; the solver now warns on ties).

[grid]
dims  = [65, 21, 3]
pitch = 100e-6

[[block]]                       # pad 1
from  = [0, 0, 0]
to    = [30, 21, 3]
sigma = 5.8e7

[[block]]                       # pad 2
from  = [35, 0, 0]
to    = [65, 21, 3]
sigma = 5.8e7

[[wire]]
name   = "A"
points = [[2.45e-3, 0.45e-3, 0.31e-3], [2.45e-3, 0.45e-3, 1.0e-3],
          [2.9e-3, 0.45e-3, 1.3e-3], [3.6e-3, 0.45e-3, 1.3e-3],
          [4.05e-3, 0.45e-3, 1.0e-3], [4.05e-3, 0.45e-3, 0.31e-3]]
radius = 125e-6
sigma  = 3.77e7
max_seglen = 300e-6

[[wire]]
name   = "B"
points = [[2.45e-3, 1.05e-3, 0.31e-3], [2.45e-3, 1.05e-3, 1.0e-3],
          [2.9e-3, 1.05e-3, 1.3e-3], [3.6e-3, 1.05e-3, 1.3e-3],
          [4.05e-3, 1.05e-3, 1.0e-3], [4.05e-3, 1.05e-3, 0.31e-3]]
radius = 125e-6
sigma  = 3.77e7
max_seglen = 300e-6

[[wire]]
name   = "C"
points = [[2.45e-3, 1.65e-3, 0.31e-3], [2.45e-3, 1.65e-3, 1.0e-3],
          [2.9e-3, 1.65e-3, 1.3e-3], [3.6e-3, 1.65e-3, 1.3e-3],
          [4.05e-3, 1.65e-3, 1.0e-3], [4.05e-3, 1.65e-3, 0.31e-3]]
radius = 125e-6
sigma  = 3.77e7
max_seglen = 300e-6

[port]
p_cells = [[0, 5, 1], [0, 6, 1], [0, 7, 1], [0, 8, 1], [0, 9, 1],
           [0, 10, 1], [0, 11, 1], [0, 12, 1], [0, 13, 1],
           [0, 14, 1], [0, 15, 1], [0, 16, 1]]
n_cells = [[64, 5, 1], [64, 6, 1], [64, 7, 1], [64, 8, 1], [64, 9, 1],
           [64, 10, 1], [64, 11, 1], [64, 12, 1], [64, 13, 1],
           [64, 14, 1], [64, 15, 1], [64, 16, 1]]

[solve]
freq = [1e5, 1e6, 3e6, 1e7, 3e7]
