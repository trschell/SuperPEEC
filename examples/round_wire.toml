# A round copper wire built from the SUBPIXEL [[cylinder]] primitive
# (stage A of the subpixel program, 2026-08-18). The cylinder is
# voxelized WITH per-cell fill fractions: boundary cells carry
# sigma_eff = sigma*fill, so the partial-cell RESISTANCE is exact
# through the per-cell-conductivity machinery. Measured on this wire
# at the DC limit: the center-in staircase (32 full cells vs
# pi*R^2 = 28.27 cell areas) reads R -11.6% low; the fill-corrected
# model lands within ~1% of L/(sigma*pi*R^2).
#
# v1 scope, stated honestly: resistance only -- the partial-cell
# INDUCTANCE correction is stage B; the sub-cell skin engine
# auto-disables on fill models (mixed effective conductivity), so
# run fine pitches at high frequency for now. Keep port faces on
# solid-ish cells (the sliver cells at the rim carry little current).

[grid]
dims  = [96, 8, 8]
pitch = 1e-6

[[cylinder]]
name   = "wire"
axis   = "x"
center = [4e-6, 4e-6]     # transverse (y, z), metres
radius = 3e-6
sigma  = 5.8e7

[port]
p_faces = [[0, 1, 2, "-x"], [0, 1, 3, "-x"], [0, 1, 4, "-x"], 
           [0, 1, 5, "-x"], [0, 2, 1, "-x"], [0, 2, 2, "-x"], 
           [0, 2, 3, "-x"], [0, 2, 4, "-x"], [0, 2, 5, "-x"], 
           [0, 2, 6, "-x"], [0, 3, 1, "-x"], [0, 3, 2, "-x"], 
           [0, 3, 3, "-x"], [0, 3, 4, "-x"], [0, 3, 5, "-x"], 
           [0, 3, 6, "-x"], [0, 4, 1, "-x"], [0, 4, 2, "-x"], 
           [0, 4, 3, "-x"], [0, 4, 4, "-x"], [0, 4, 5, "-x"], 
           [0, 4, 6, "-x"], [0, 5, 1, "-x"], [0, 5, 2, "-x"], 
           [0, 5, 3, "-x"], [0, 5, 4, "-x"], [0, 5, 5, "-x"], 
           [0, 5, 6, "-x"], [0, 6, 2, "-x"], [0, 6, 3, "-x"], 
           [0, 6, 4, "-x"], [0, 6, 5, "-x"]]
n_faces = [[95, 1, 2, "+x"], [95, 1, 3, "+x"], [95, 1, 4, "+x"], 
           [95, 1, 5, "+x"], [95, 2, 1, "+x"], [95, 2, 2, "+x"], 
           [95, 2, 3, "+x"], [95, 2, 4, "+x"], [95, 2, 5, "+x"], 
           [95, 2, 6, "+x"], [95, 3, 1, "+x"], [95, 3, 2, "+x"], 
           [95, 3, 3, "+x"], [95, 3, 4, "+x"], [95, 3, 5, "+x"], 
           [95, 3, 6, "+x"], [95, 4, 1, "+x"], [95, 4, 2, "+x"], 
           [95, 4, 3, "+x"], [95, 4, 4, "+x"], [95, 4, 5, "+x"], 
           [95, 4, 6, "+x"], [95, 5, 1, "+x"], [95, 5, 2, "+x"], 
           [95, 5, 3, "+x"], [95, 5, 4, "+x"], [95, 5, 5, "+x"], 
           [95, 5, 6, "+x"], [95, 6, 2, "+x"], [95, 6, 3, "+x"], 
           [95, 6, 4, "+x"], [95, 6, 5, "+x"]]

[solve]
freq = [1e5]
