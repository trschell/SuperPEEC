# A round copper wire built from the [[cylinder]] primitive: the
# cylinder is voxelized WITH per-cell fill fractions (the model's fill
# record), so a boundary cell's resistance carries sigma*fill exactly
# and its inductance footprint gets the matching partial-cell
# correction, both automatically. Measured on this wire at the DC
# limit: the center-in staircase (32 full cells vs pi*R^2 = 28.27
# cell areas) reads R -11.6% low; the fill-corrected model lands
# within ~1% of L/(sigma*pi*R^2), and L improves staircase 2.4% ->
# fill 1.2% -> fill+dL 0.9% against a 2x reference.
#
# Sub-cell modes anchored to the resolved surface (the Kelvin skin
# profile to ~1% at dx/delta 1-2) need an EQUIPOTENTIAL port on whole
# cells; this file drives the prescribed-current port, so it exercises
# the partial-cell geometry alone. Keep port faces on solid-ish cells
# (the sliver cells at the rim carry little current).

[grid]
dims  = [96, 8, 8]
pitch = 1e-6

[[cylinder]]
name   = "wire"
axis   = "x"
center = [4e-6, 4e-6]     # transverse (y, z), metres
radius = 3e-6
sigma  = 5.8e7

[port]
p_faces = [[0, 1, 2, "-x"], [0, 1, 3, "-x"], [0, 1, 4, "-x"], 
           [0, 1, 5, "-x"], [0, 2, 1, "-x"], [0, 2, 2, "-x"], 
           [0, 2, 3, "-x"], [0, 2, 4, "-x"], [0, 2, 5, "-x"], 
           [0, 2, 6, "-x"], [0, 3, 1, "-x"], [0, 3, 2, "-x"], 
           [0, 3, 3, "-x"], [0, 3, 4, "-x"], [0, 3, 5, "-x"], 
           [0, 3, 6, "-x"], [0, 4, 1, "-x"], [0, 4, 2, "-x"], 
           [0, 4, 3, "-x"], [0, 4, 4, "-x"], [0, 4, 5, "-x"], 
           [0, 4, 6, "-x"], [0, 5, 1, "-x"], [0, 5, 2, "-x"], 
           [0, 5, 3, "-x"], [0, 5, 4, "-x"], [0, 5, 5, "-x"], 
           [0, 5, 6, "-x"], [0, 6, 2, "-x"], [0, 6, 3, "-x"], 
           [0, 6, 4, "-x"], [0, 6, 5, "-x"]]
n_faces = [[95, 1, 2, "+x"], [95, 1, 3, "+x"], [95, 1, 4, "+x"], 
           [95, 1, 5, "+x"], [95, 2, 1, "+x"], [95, 2, 2, "+x"], 
           [95, 2, 3, "+x"], [95, 2, 4, "+x"], [95, 2, 5, "+x"], 
           [95, 2, 6, "+x"], [95, 3, 1, "+x"], [95, 3, 2, "+x"], 
           [95, 3, 3, "+x"], [95, 3, 4, "+x"], [95, 3, 5, "+x"], 
           [95, 3, 6, "+x"], [95, 4, 1, "+x"], [95, 4, 2, "+x"], 
           [95, 4, 3, "+x"], [95, 4, 4, "+x"], [95, 4, 5, "+x"], 
           [95, 4, 6, "+x"], [95, 5, 1, "+x"], [95, 5, 2, "+x"], 
           [95, 5, 3, "+x"], [95, 5, 4, "+x"], [95, 5, 5, "+x"], 
           [95, 5, 6, "+x"], [95, 6, 2, "+x"], [95, 6, 3, "+x"], 
           [95, 6, 4, "+x"], [95, 6, 5, "+x"]]

[solve]
freq = [1e5]
