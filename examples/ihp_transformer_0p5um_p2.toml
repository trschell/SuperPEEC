# IHP SG13G2 1:1 interwound octagonal transformer -- SuperPEEC model
# generated by studies/ihp_spiral_gds2toml.py from xfmr5.gds (coils as trace)
# (layout: studies/ihp_transformer_gds.py on the IHP gdsfactory PDK, ihp-gdsfactory)
#
# 5 turns per winding, width 15.0 um, space 3.0 um, inner diameter 240 um, outer 630 um flat to flat; 7.27 mm per winding
# DRIVEN: the secondary (port P1 on its lead pair); the primary is open
# stack (PDK, um): TopMetal1 6.23+2.0, TopVia2 8.23+2.8, TopMetal2 11.03+3.0; modelled TM1 [0,2), TV2 [2,5) (2.8 -> 3.0), TM2 [5,8)
# sigma (nominal, S/m): TM2 3e+07, TM1 2.8e+07, W 1.8e+07 x array fill (0.189, 0.189); no substrate/oxide
#
# ATTRIBUTION: layer numbers and the SG13G2 BEOL stack come from the
# IHP Open PDK through ihp-gdsfactory (Apache-2.0,
# https://github.com/gdsfactory/IHP); the transformer itself is generated
# by studies/ihp_transformer_gds.py (the PDK's inductor2/3 PCells are
# 1-3 turn cells). No PDK file is copied here.
#
# WHAT THIS MODEL IS (and is not): the conductors in free space --
# the coil's inductance and its conductor loss with skin and
# proximity effect. A real SG13G2 coil sits on ~6 um of oxide over a
# lossy silicon substrate, which sets its self-resonance and most of
# its Q loss above a few GHz; neither is represented here (no
# capacitance, no substrate). Use L and the conductor R; take Q and
# SRF from a substrate-aware solver.
# For the transformer the same holds for the INTERWINDING
# capacitance (common-mode coupling, the windings' self-
# resonance): L1, L2, M, k and the winding resistances are what
# this model delivers. The 2-port is read with
# studies/ihp_transformer_2port.py from the _p1 and _p2 files.
#
# pitch 0.5 um cubic: lattice 1232 x 1508 x 16 = 29.7 M, staircase estimate ~5.45 M occupied cells, 8 blocks, 2 traces
#
# MEASURED (2026-10-05, sppeec, OpenCL fp32, 62 GB host, 12 GB card), 2-port
# by studies/ihp_transformer_2port.py from the _p1 and _p2 files:
#   occupied cells 5,561,904 (233,160 partial rim cells), both windings.
#   Each drive 7:38 wall, peak RSS 8.9 GB.
#     f        R1 [ohm]  L1=L2 [nH]  M [nH]    k       R12 [ohm]  Z12/Z21
#     1 GHz    7.596     13.545      11.860    0.8756  1.083      4e-7
#     5 GHz    14.961    13.128      11.669    0.8889  3.684      5e-7
#     10 GHz   21.299    13.006      11.628    0.8941  5.800      1e-7
#   The quick rung of the _0p25um files (same geometry).

